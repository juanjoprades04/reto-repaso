services:
  postgres_final:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definida en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definida en .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definida en .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  python_final:
    build: .
    volumes:
      - .:/python_final
    env_file: .env


volumes:
  postgres_data:
  python_final: